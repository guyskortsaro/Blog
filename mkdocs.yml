site_name: Guy's Blog
site_url: https://guyskortsaro.github.io/
site_description: Projects and other usefull information.
site_author: guy Skortsaro

repo_url: https://github.com/guyskortsaro/Blog/

theme:
    name: material
    palette:
      primary: grey
    features:
    - content.code.copy
    - content.code.annotate
    # - toc.integrate
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.expand

    # Search
    # https://squidfunk.github.io/mkdocs-material/setup/setting-up-site-search
    - search.suggest # display the likeliest completion for the last word
    - search.highlight # highlight all occurrences
    - search.share # show a share button of the current search

nav:
  - Home: index.md
  - 2 DOF Gimbal: 2_dof_gimbal/index.md

plugins:
    - search
    - tags
    - mkdocs-pdf
 #   - include_uri
 #   - file_nav_links

markdown_extensions:
  - attr_list
  - pymdownx.highlight:
      linenums: true  # Enables line numbers (optional)
      anchor_linenums: true
      use_pygments: true  # Ensures syntax highlighting
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.arithmatex: # render math equations
      generic: true
  - pymdownx.arithmatex

extra_javascript:
  - https://unpkg.com/clipboard@2/dist/clipboard.min.js
  - assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - extra.css